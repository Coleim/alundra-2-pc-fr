# The standalone engine (src/native/, target alundra2), built on Linux, macOS and Windows
# (cross-compiled with MinGW). The game's translated code (src/game/lifted/) comes from the
# player's own disc and is not in the repository: these builds use the empty registry
# (A2_ENGINE_ONLY=ON) and check that the engine and the hand-written game code compile and
# link everywhere. Complete builds are made locally: tools/a2lift.py, then
# scripts/package_native.sh (docs/ENGINE.md, "Building").
name: Standalone engine

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
            cmake_args: ""
          - name: macos
            os: macos-14
            cmake_args: "-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0"
          - name: windows-x64
            os: ubuntu-24.04
            cmake_args: "-DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-mingw-w64.cmake"
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libpulse-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxkbcommon-dev libwayland-dev \
            libdecor-0-dev libudev-dev libdbus-1-dev
          if [ "${{ matrix.name }}" = "windows-x64" ]; then sudo apt-get install -y mingw-w64; fi

      - name: Packages (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DA2_FRAMEWORK=OFF -DA2_ENGINE_ONLY=ON -DA2_FETCH_SDL3=ON ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --target alundra2

      - name: GPU replay tool
        if: matrix.name != 'windows-x64'
        run: cc -O2 -Isrc/native tools/gpucheck/gpucheck.c src/native/gpu.c -o build/gpucheck

      - uses: actions/upload-artifact@v4
        with:
          name: alundra2-engine-${{ matrix.name }}
          path: |
            build/alundra2
            build/alundra2.exe
          if-no-files-found: ignore
